<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="titulo" >Preparado? Clique!</h1>
    <button onClick="acaoBotao()">Clicar</button>
    <button onClick="inserirElemento()">inserir</button>

    <script>
        let cont = 0;
        function acaoBotao() {
            cont +=1;
            document.getElementById("titulo").innerHTML = `Número do clique ${cont}`;
        }

        function inserirElemento() {
            cont += 1;
            const novoParagrafo = document.createElement("p");
            novoParagrafo.textContent = `Clique ${cont}`;

            document.body.appendChild(novoParagrafo);
        }
    </script>
</body>
</html>
