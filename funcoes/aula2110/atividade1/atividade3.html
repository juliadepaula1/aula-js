<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Funções</title>
    </head>
    <body>
        
        <script>
            let nome = prompt("Digite seu nome:");
            let idade = prompt("E agora a sua idade:");

            mensagemPersonalizada (nome, idade);

            function mensagemPersonalizada(nome, idade) {


                alert("Você é " + nome + " e tem " + idade + " anos " );

            }
        </script>
    </body>
</html>
